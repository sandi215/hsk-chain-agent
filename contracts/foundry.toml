[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./node_modules" }, { access = "read", path = "./artifacts" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
]
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.default.fuzz]
runs = 200
